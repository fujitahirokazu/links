<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藤田弘和｜明日使える名著 — リンク集</title>
<meta name="description" content="名著を『明日の仕事で使える形』に翻訳。YouTube・note・Instagram・X の発信をまとめたリンク集。">
<!-- OGP -->
<meta property="og:title" content="藤田弘和｜明日使える名著">
<meta property="og:description" content="名著を『明日の仕事で使える形』に翻訳。各SNSのリンク集。">
<meta property="og:type" content="website">
<style>
  :root{
    --paper:#f4efe6;
    --ink:#211c16;
    --muted:#6f655a;
    --card:#fffdf9;
    --line:#e6ddcd;
    --accent:#5b4636;
    --shadow:0 2px 14px rgba(40,30,15,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -10%, #fbf7ef 0%, var(--paper) 60%) fixed;
    color:var(--ink);
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding:32px 18px 56px;
    line-height:1.6;
  }
  .wrap{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center}

  .avatar{
    width:96px;height:96px;border-radius:50%;
    background:linear-gradient(160deg,#6b5340,#473428);
    display:flex;align-items:center;justify-content:center;
    color:#f4efe6;font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:30px;letter-spacing:2px;font-weight:700;
    box-shadow:var(--shadow);border:3px solid #fffdf9;
  }
  h1{
    font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:23px;margin-top:16px;letter-spacing:.5px;
  }
  .handle{color:var(--muted);font-size:13px;margin-top:3px}
  .tagline{
    text-align:center;font-size:14px;color:var(--ink);
    margin-top:14px;max-width:340px;
  }

  .links{width:100%;margin-top:26px;display:flex;flex-direction:column;gap:13px}
  a.link{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 18px;text-decoration:none;color:var(--ink);
    box-shadow:var(--shadow);transition:transform .12s ease, box-shadow .12s ease;
    position:relative;
  }
  a.link:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(40,30,15,.13)}
  a.link:active{transform:translateY(0)}
  .ic{flex:0 0 26px;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
  .ic svg{width:24px;height:24px;display:block}
  .lt{display:flex;flex-direction:column;min-width:0}
  .lt .t{font-weight:700;font-size:15px}
  .lt .s{font-size:12px;color:var(--muted)}
  .chev{margin-left:auto;color:#c9bca7;flex:0 0 auto}

  a.link.feature{
    background:linear-gradient(135deg,#2bb39b,#1f9f88);
    border-color:transparent;color:#fff;
  }
  a.link.feature .lt .s{color:rgba(255,255,255,.85)}
  a.link.feature .chev{color:rgba(255,255,255,.8)}
  a.link.feature .ic svg{fill:#fff}

  .badge{
    position:absolute;top:-9px;right:14px;background:#e9b949;color:#3a2c00;
    font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:999px;
  }

  footer{margin-top:34px;font-size:11px;color:#a89b88;text-align:center}
  footer a{color:#8c7d68}
</style>
</head>
<body>
  <main class="wrap">
    <div class="avatar">弘和</div>
    <h1>明日使える名著</h1>
    <div class="handle">藤田弘和 / Hirokazu Fujita</div>
    <p class="tagline">名著を『明日の仕事で使える形』に翻訳。<br>年100冊のビジネス書を、5分の解説に。</p>

    <nav class="links" id="links"></nav>

    <footer>
      © <span id="yr"></span> 藤田弘和 ｜ 明日使える名著
    </footer>
  </main>

<script>

  const chev = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>';
  const root = document.getElementById('links');
  root.innerHTML = LINKS.map(l => `
    <a class="link${l.feature?' feature':''}" href="${l.url}" target="_blank" rel="noopener">
      ${l.badge?`<span class="badge">${l.badge}</span>`:''}
      <span class="ic">${l.icon}</span>
      <span class="lt"><span class="t">${l.t}</span><span class="s">${l.s}</span></span>
      ${chev}

  document.getElementById('yr').textContent = new Date().getFullYear();
</script>
</body>
</html>
